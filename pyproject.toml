[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"config" = "airinsights/config"

[project]
name = "airinsights"
version = "2026.10.09.b" # Year.Month.Day-Beta
authors = [
  { name = "Environmental Defense Fund", email = "edfair@edf.org"},
]
maintainers = [
  {name = "Alex Adame"},
  {name = "Vana Brookins"},
  {name = "Gabriella Brinkley"},
  {name = "Libby Mohr"},
  {name = "Lauren Padilla"},
  {name = "Dan Peters"},
]
description = "A suite of open-source analysis tools that turn complex air quality datasets into localized insights to drive targeted clean-air actions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "boto3 >= 1.43.0",
    "geopandas >= 1.1.4",
    "google-cloud-bigquery >= 3.40.0",
    "numpy >= 2.1.0",
    "openaq >= 1.1.0",
    "pandas >= 3.0.0",
    "polars >= 1.39.0",
    "pyarrow >= 23.0.1",
    "pymannkendall >= 1.4.3",
    "pyyaml >= 6.0.3",
    "requests >= 2.34.2",
    "rioxarray >= 0.23.0",
    "rasterio >= 1.5.0",
    "shapely >= 2.2.0",
    "scikit-learn >= 1.8.0"
]

[project.urls]
Homepage = "https://github.com/edf-org/airinsights"